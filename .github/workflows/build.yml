name: Build Latino Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build plugins
        run: gradle make --no-daemon --info 2>&1 | tail -100
        continue-on-error: true

      - name: Find all output files
        run: find . -name "*.cs3" -o -name "*.aar" -o -name "*.apk" | grep -v ".gradle"

      - name: Collect files
        run: |
          mkdir -p builds
          find . \( -name "*.cs3" -o -name "*.aar" \) -not -path "*/.gradle/*" -exec cp {} builds/ \;
          ls -la builds/

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: latino-plugins
          path: builds/
