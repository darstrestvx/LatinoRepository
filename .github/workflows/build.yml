name: Build Latino Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build plugins
        run: gradle assembleRelease --no-daemon
        continue-on-error: true

      - name: Collect and rename to cs3
        run: |
          mkdir -p builds
          find . -name "*.aar" -not -path "*/.gradle/*" | while read f; do
            name=$(basename "$f" .aar)
            cp "$f" "builds/${name}.cs3"
          done
          ls -la builds/

      - name: Push builds to repo
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add builds/
          git commit -m "Update builds" || echo "Nothing to commit"
          git push
