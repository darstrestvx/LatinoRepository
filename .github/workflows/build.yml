name: Build Latino Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build with Gradle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Collect cs3 files
        run: |
          mkdir -p builds
          find . -name "*.cs3" -exec cp {} builds/ \;

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: latino-plugins
          path: builds/
