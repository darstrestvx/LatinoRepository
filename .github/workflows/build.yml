name: Build Latino Repository

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build plugins
        run: gradle assembleRelease --no-daemon
        continue-on-error: true

      - name: Find all files
        run: |
          echo "=== Buscando archivos ==="
          find . -type f \( -name "*.cs3" -o -name "*.aar" -o -name "*.zip" \) -not -path "*/.gradle/*" -not -path "*/cache/*"
          echo "=== Directorios build ==="
          find . -type d -name "build" -not -path "*/.gradle/*"

      - name: Collect cs3 files
        run: |
          mkdir -p builds
          find . -name "*.cs3" -not -path "*/.gradle/*" -exec cp {} builds/ \;
          find . -name "*.aar" -not -path "*/.gradle/*" -exec cp {} builds/ \;
          ls -la builds/ || echo "No files found"

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: latino-plugins
          path: builds/
          if-no-files-found: warn
